name: Deploy Kubernetes control plane manifest

run-name: ${{ github.ref_name == 'main' && format('Deploy {0} manifest to {1} control plane', inputs.manifest, inputs.environment) || format('Validate {0} manifest in {1}', inputs.manifest, inputs.environment) }}

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy the manifest"
        required: true
        type: choice
        default: dev
        options:
          - dev

      manifest:
        description: "Control-plane manifest to deploy"
        required: true
        type: choice
        default: kube-apiserver.yaml
        options:
          - etcd.yaml
          - kube-apiserver.yaml
          - kube-controller-manager.yaml
          - kube-scheduler.yaml

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: robotshop-k8s-dev
  WIF_PROVIDER: projects/1034830772222/locations/global/workloadIdentityPools/github-actions/providers/github
  ANSIBLE_SERVICE_ACCOUNT: ansible@robotshop-k8s-dev.iam.gserviceaccount.com

jobs:
  manifest_validation:
    name: Validate manifest
    runs-on:
      group: ${{ inputs.RUNNER_GROUP || 'Local Runners' }}
      labels: ${{ inputs.RUNNER_LABEL || 'self-hosted' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: gcp_auth
        uses: robot-shop-DevOps/robot-shop-github-actions/.github/actions/gcp/wif-login@gcp
        with:
          GCP_PROJECT: ${{ env.GCP_PROJECT_ID }}
          WORKLOAD_IDENTITY_PROVIDER: ${{ env.WIF_PROVIDER }}
          SERVICE_ACCOUNT: ${{ env.ANSIBLE_SERVICE_ACCOUNT }}
          create_credentials_file: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ansible dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ansible requests google-auth
          ansible-galaxy collection install google.cloud

      - name: Create temporary OS Login SSH credentials
        shell: bash
        env:
          CLOUDSDK_CORE_ACCOUNT: ${{ env.ANSIBLE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail

          SSH_DIR="$RUNNER_TEMP/robotshop-ssh"
          SSH_KEY_PATH="$SSH_DIR/google_compute_engine"

          mkdir -p "$SSH_DIR"
          chmod 700 "$SSH_DIR"

          ssh-keygen -t rsa -b 4096 -f "$SSH_KEY_PATH" -N "" -q

          chmod 600 "$SSH_KEY_PATH"

          gcloud compute os-login ssh-keys add \
            --key-file="$SSH_KEY_PATH.pub" \
            --ttl=2h

          OS_LOGIN_USERNAME="$(gcloud compute os-login describe-profile \
            --format='value(posixAccounts[0].username)')"

          if [[ -z "$OS_LOGIN_USERNAME" ]]; then
            echo "::error::Could not determine the OS Login username."
            exit 1
          fi

          echo "OS_LOGIN_USERNAME=$OS_LOGIN_USERNAME" >> "$GITHUB_ENV"
          echo "SSH_KEY_PATH=$SSH_KEY_PATH" >> "$GITHUB_ENV"

          echo "Temporary SSH credentials created."

      - name: Validate selected manifest
        env:
          MANIFEST: ${{ inputs.manifest }}
          ANSIBLE_SSH_COMMON_ARGS: "-o StrictHostKeyChecking=accept-new"
        run: |
          ansible-playbook \
            -i "ansible/env/${{ inputs.environment }}/inventory.gcp.yaml" \
            ansible/control_plane_manifests.yaml \
            --tags manifest_validation \
            --user "$OS_LOGIN_USERNAME" \
            --private-key "$SSH_KEY_PATH" \
            -e "manifest=$MANIFEST"

      - name: Remove temporary OS Login SSH credentials
        if: ${{ always() }}
        shell: bash
        env:
          CLOUDSDK_CORE_ACCOUNT: ${{ env.ANSIBLE_SERVICE_ACCOUNT }}
        run: |
          SSH_DIR="$RUNNER_TEMP/robotshop-ssh"
          SSH_KEY_PATH="$SSH_DIR/google_compute_engine"

          if [[ -f "$SSH_KEY_PATH.pub" ]]; then
            gcloud compute os-login ssh-keys remove \
              --key-file="$SSH_KEY_PATH.pub" \
              --quiet || echo "::warning::Could not remove the temporary OS Login public key."
          fi

          rm -rf "$SSH_DIR"


  manifest_deployment:
    if: ${{ github.ref_name == 'main' }}
    name: Deploy manifest
    needs: manifest_validation
    runs-on:
      group: ${{ inputs.RUNNER_GROUP || 'Local Runners' }}
      labels: ${{ inputs.RUNNER_LABEL || 'self-hosted' }}

    environment:
      name: ${{ inputs.environment }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: gcp_auth
        uses: robot-shop-DevOps/robot-shop-github-actions/.github/actions/gcp/wif-login@gcp
        with:
          GCP_PROJECT: ${{ env.GCP_PROJECT_ID }}
          WORKLOAD_IDENTITY_PROVIDER: ${{ env.WIF_PROVIDER }}
          SERVICE_ACCOUNT: ${{ env.ANSIBLE_SERVICE_ACCOUNT }}
          create_credentials_file: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ansible dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ansible requests google-auth
          ansible-galaxy collection install google.cloud

      - name: Create temporary OS Login SSH credentials
        shell: bash
        env:
          CLOUDSDK_CORE_ACCOUNT: ${{ env.ANSIBLE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail

          SSH_DIR="$RUNNER_TEMP/robotshop-ssh"
          SSH_KEY_PATH="$SSH_DIR/google_compute_engine"

          mkdir -p "$SSH_DIR"
          chmod 700 "$SSH_DIR"

          ssh-keygen -t rsa -b 4096 -f "$SSH_KEY_PATH" -N "" -q

          chmod 600 "$SSH_KEY_PATH"

          gcloud compute os-login ssh-keys add \
            --key-file="$SSH_KEY_PATH.pub" \
            --ttl=2h

          OS_LOGIN_USERNAME="$(gcloud compute os-login describe-profile \
            --format='value(posixAccounts[0].username)')"

          if [[ -z "$OS_LOGIN_USERNAME" ]]; then
            echo "::error::Could not determine the OS Login username."
            exit 1
          fi

          echo "OS_LOGIN_USERNAME=$OS_LOGIN_USERNAME" >> "$GITHUB_ENV"
          echo "SSH_KEY_PATH=$SSH_KEY_PATH" >> "$GITHUB_ENV"

          echo "Temporary SSH credentials created."

      - name: Deploy selected manifest
        env:
          MANIFEST: ${{ inputs.manifest }}
          ANSIBLE_SSH_COMMON_ARGS: "-o StrictHostKeyChecking=accept-new"
        run: |
          ansible-playbook \
            -i "ansible/env/${{ inputs.environment }}/inventory.gcp.yaml" \
            ansible/control_plane_manifests.yaml \
            --tags manifest_deployment \
            --user "$OS_LOGIN_USERNAME" \
            --private-key "$SSH_KEY_PATH" \
            -e "manifest=$MANIFEST"

      - name: Remove temporary OS Login SSH credentials
        if: ${{ always() }}
        shell: bash
        env:
          CLOUDSDK_CORE_ACCOUNT: ${{ env.ANSIBLE_SERVICE_ACCOUNT }}
        run: |
          SSH_DIR="$RUNNER_TEMP/robotshop-ssh"
          SSH_KEY_PATH="$SSH_DIR/google_compute_engine"

          if [[ -f "$SSH_KEY_PATH.pub" ]]; then
            gcloud compute os-login ssh-keys remove \
              --key-file="$SSH_KEY_PATH.pub" \
              --quiet || echo "::warning::Could not remove the temporary OS Login public key."
          fi

          rm -rf "$SSH_DIR"