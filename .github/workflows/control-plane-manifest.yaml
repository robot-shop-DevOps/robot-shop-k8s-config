name: Deploy Kubernetes control plane manifest

run-name: ${{ github.ref_name == 'main' && format('Deploy {0} manifest to control plane', inputs.manifest) || format('Validate {0} manifest', inputs.manifest) }}

on:
  workflow_dispatch:
    inputs:
      manifest:
        description: "Control-plane manifest to deploy"
        required: true
        type: choice
        default: kube-apiserver.yaml
        options:
          - etcd.yaml
          - kube-apiserver.yaml
          - kube-controller-manager.yaml
          - kube-scheduler.yaml

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: robotshop-k8s-dev
  WIF_PROVIDER: projects/1034830772222/locations/global/workloadIdentityPools/github-actions/providers/github
  ANSIBLE_SERVICE_ACCOUNT: ansible@robotshop-k8s-dev.iam.gserviceaccount.com

jobs:
  manifest_validation:
    name: Validate manifest
    runs-on:
      group: ${{ inputs.RUNNER_GROUP || 'Local Runners' }}
      labels: ${{ inputs.RUNNER_LABEL || 'self-hosted' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: gcp_auth
        uses: robot-shop-DevOps/robot-shop-github-actions/.github/actions/gcp/wif-login@gcp
        with:
          GCP_PROJECT: ${{ inputs.GCP_PROJECT }}
          WORKLOAD_IDENTITY_PROVIDER: ${{ env.WIF_PROVIDER }}
          SERVICE_ACCOUNT: ${{ env.ANSIBLE_SERVICE_ACCOUNT }}
          TOKEN_FORMAT: access_token

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ansible dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ansible requests google-auth
          ansible-galaxy collection install google.cloud

      - name: Validate selected manifest
        env:
          MANIFEST: ${{ inputs.manifest }}
        run: |
          ansible-playbook \
            -i inventory/gcp_compute.yaml \
            playbooks/control_plane_manifests.yaml \
            --tags manifest_validation \
            -e "manifest=${MANIFEST}"

  manifest_deployment:
    name: Deploy manifest
    needs: manifest_validation
    runs-on:
      group: ${{ inputs.RUNNER_GROUP || 'Local Runners' }}
      labels: ${{ inputs.RUNNER_LABEL || 'self-hosted' }}

    environment:
      name: robotshop-k8s-dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: gcp_auth
        uses: robot-shop-DevOps/robot-shop-github-actions/.github/actions/gcp/wif-login@gcp
        with:
          GCP_PROJECT: ${{ inputs.GCP_PROJECT }}
          WORKLOAD_IDENTITY_PROVIDER: ${{ env.WIF_PROVIDER }}
          SERVICE_ACCOUNT: ${{ inputs.ANSIBLE_SERVICE_ACCOUNT }}
          TOKEN_FORMAT: access_token

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ansible dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ansible requests google-auth
          ansible-galaxy collection install google.cloud

      - name: Deploy selected manifest
        env:
          MANIFEST: ${{ inputs.manifest }}
        run: |
          ansible-playbook \
            -i inventory/gcp_compute.yaml \
            playbooks/control_plane_manifests.yaml \
            --tags manifest_deployment \
            -e "manifest=${MANIFEST}"
